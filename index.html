
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option AI VIP Bot</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #38bdf8; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }
        .signal-call { color: #22c55e; font-size: 24px; font-weight: bold; }
        .signal-put { color: #ef4444; font-size: 24px; font-weight: bold; }
        .vip-badge {
            background: #f59e0b;
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Pocket Option AI VIP Bot</h2>
    
    <div class="form-group">
        <label for="pairSelect">Select Asset Pair (Live & OTC):</label>
        <select id="pairSelect">
            <!-- Live Pairs -->
            <option value="EURUSD">EUR/USD (Live)</option>
            <option value="GBPUSD">GBP/USD (Live)</option>
            <option value="USDJPY">USD/JPY (Live)</option>
            <option value="AUDUSD">AUD/USD (Live)</option>
            <option value="USDCAD">USD/CAD (Live)</option>
            <option value="EURGBP">EUR/GBP (Live)</option>
            <option value="GBPJPY">GBP/JPY (Live)</option>
            
            <!-- OTC Pairs -->
            <option value="EURUSD-OTC">EUR/USD OTC (VIP)</option>
            <option value="GBPUSD-OTC">GBP/USD OTC (VIP)</option>
            <option value="USDJPY-OTC">USD/JPY OTC (VIP)</option>
            <option value="AUDUSD-OTC">AUD/USD OTC (VIP)</option>
            <option value="USDCAD-OTC">USD/CAD OTC (VIP)</option>
            <option value="EURGBP-OTC">EUR/GBP OTC (VIP)</option>
            <option value="GBPJPY-OTC">GBP/JPY OTC (VIP)</option>
            <option value="NZDUSD-OTC">NZD/USD OTC (VIP)</option>
            <option value="USDCHF-OTC">USD/CHF OTC (VIP)</option>
            <option value="EURJPY-OTC">EUR/JPY OTC (VIP)</option>
        </select>
    </div>

    <button onclick="getSignal()">Generate VIP Signal</button>

    <div class="result-box" id="resultBox">
        <span id="vipBadge" class="vip-badge" style="display:none;">VIP SIGNAL</span>
        <h3>Analysis Result:</h3>
        <p><strong>Asset:</strong> <span id="resSymbol">-</span></p>
        <p><strong>Signal:</strong> <span id="resAction">-</span></p>
        <p><strong>Pattern:</strong> <span id="resPattern">-</span></p>
        <p><strong>RSI (14):</strong> <span id="resRsi">-</span></p>
        <p><strong>Trend:</strong> <span id="resTrend">-</span></p>
        <p><strong>Confidence:</strong> <span id="resConf">-</span></p>
    </div>
</div>

<script>
async function getSignal() {
    const symbol = document.getElementById("pairSelect").value;
    const isOtc = symbol.includes("OTC");

    // Dummy mock candle data generate kar rahe hain testing ke liye (backend real data ya API se connect hoga)
    let mockCandles = [];
    let basePrice = 1.0850;
    for(let i=0; i<40; i++) {
        let change = (Math.random() - 0.48) * 0.0010;
        basePrice += change;
        mockCandles.push({
            open: basePrice - 0.0002,
            high: basePrice + 0.0005,
            low: basePrice - 0.0005,
            close: basePrice,
            volume: 1000 + Math.random() * 500
        });
    }

    const payload = {
        symbol: symbol,
        is_otc: isOtc,
        candles: mockCandles
    };

    try {
        // Agar backend Vercel par deployed hai toh yahan uska URL aayega, local ke liye '/analyze'
        let response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        let data = await response.json();
        
        document.getElementById("resSymbol").innerText = data.symbol;
        let actionElem = document.getElementById("resAction");
        
        if (data.action === "CALL") {
            actionElem.innerHTML = `<span class="signal-call">🟢 CALL (UP)</span>`;
        } else if (data.action === "PUT") {
            actionElem.innerHTML = `<span class="signal-put">🔴 PUT (DOWN)</span>`;
        } else {
            actionElem.innerHTML = `<span style="color:#facc15;">⏳ HOLD (WAIT)</span>`;
        }

        document.getElementById("resPattern").innerText = data.pattern;
        document.getElementById("resRsi").innerText = data.rsi;
        document.getElementById("resTrend").innerText = data.trend;
        document.getElementById("resConf").innerText = (data.confidence * 100) + "%";

        // Show VIP Badge if it's a VIP signal
        if (data.signal_type && data.signal_type.includes("VIP")) {
            document.getElementById("vipBadge").style.display = "block";
        } else {
            document.getElementById("vipBadge").style.display = "none";
        }

        document.getElementById("resultBox").style.display = "block";

    } catch (error) {
        alert("Error fetching signal from bot backend. Make sure FastAPI is running!");
    }
}
</script>

</body>
</html>
