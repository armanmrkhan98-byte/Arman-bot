<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sniper Bot & Gemini Assistant UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile App Frame Simulator */
    .app-viewport {
      width: 100%;
      max-width: 410px;
      height: 94vh;
      background: #121824;
      border-radius: 28px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      border: 6px solid #1e293b;
      overflow: hidden;
    }

    /* Top Broker / App Header */
    .broker-header {
      padding: 14px 16px;
      background: #171d2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232d3f;
    }

    .pair-selector {
      background: #0f141c;
      color: #00e676;
      border: 1px solid #00e676;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .pair-selector option {
      background: #121824;
      color: #fff;
    }

    .balance-info {
      font-size: 14px;
      font-weight: 600;
      color: #00e676;
    }

    /* Main Scrollable Dashboard */
    .dashboard-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      background: radial-gradient(circle at center, #182030 0%, #0b0e14 100%);
    }

    /* SNIPER BOT WIDGET CONTAINER */
    .bot-modal {
      background: rgba(13, 18, 26, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bot-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bot-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #000;
      border: 1px solid #ff3366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ff3366;
      font-size: 10px;
    }

    .bot-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .bot-time-sub {
      font-size: 10px;
      color: #64748b;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: #1e293b;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .status-online {
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
    }

    .verified-badge {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00e676;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    /* Scanner Display Screen */
    .display-screen {
      height: 130px;
      background: #06090e;
      border: 1px solid #1b2433;
      border-radius: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scanner-label {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 9px;
      color: #475569;
      letter-spacing: 1px;
    }

    .screen-content {
      text-align: center;
      color: #00e676;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .signal-direction {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
    }

    .signal-up { color: #00e676; }
    .signal-down { color: #ff3366; }

    .scan-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
      display: none;
    }

    .scanning .scan-line {
      display: block;
      animation: scan 1.5s infinite ease-in-out;
    }

    @keyframes scan {
      0% { bottom: 0%; }
      50% { bottom: 100%; }
      100% { bottom: 0%; }
    }

    .bottom-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telegram-link {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111827;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #1f293d;
      font-size: 11px;
      color: #38bdf8;
      text-decoration: none;
    }

    .live-clock {
      background: #06090e;
      border: 1px solid #00e676;
      color: #00e676;
      padding: 5px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-action {
      width: 100%;
      padding: 11px;
      background: linear-gradient(180deg, #1f293d 0%, #111827 100%);
      border: 1px solid #2e3d59;
      color: #94a3b8;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: linear-gradient(180deg, #2e3d59 0%, #1f293d 100%);
      color: #ffffff;
    }

    /* GEMINI FLOATING FOOTER DOCK */
    .gemini-dock {
      background: #171d2a;
      padding: 12px 16px;
      border-top: 1px solid #232d3f;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .icon-btn.down-circle {
      background: #1e293b;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 14px;
    }

    .gemini-bar {
      width: 100%;
      background: #0f141c;
      border-radius: 35px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #232d3f;
    }

    .plus-icon {
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
    }

    .gemini-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #ffffff;
    }

    .gemini-input::placeholder {
      color: #64748b;
    }

    .mic-icon {
      font-size: 16px;
      color: #94a3b8;
      cursor: pointer;
    }

    .live-voice-pill {
      background: #1e3a8a;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #93c5fd;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Top Header & Global OTC Pair Selector -->
    <div class="broker-header">
      <select id="otcPairSelect" class="pair-selector" onchange="syncPair()">
        <option value="EUR/USD OTC">EUR/USD OTC</option>
        <option value="GBP/USD OTC">GBP/USD OTC</option>
        <option value="USD/JPY OTC">USD/JPY OTC</option>
        <option value="USD/CAD OTC">USD/CAD OTC</option>
        <option value="AUD/CAD OTC">AUD/CAD OTC</option>
        <option value="EUR/GBP OTC">EUR/GBP OTC</option>
        <option value="USD/CHF OTC">USD/CHF OTC</option>
        <option value="NZD/USD OTC">NZD/USD OTC</option>
        <option value="GBP/JPY OTC">GBP/JPY OTC</option>
        <option value="EUR/JPY OTC">EUR/JPY OTC</option>
        <option value="BTC/USD OTC">BTC/USD OTC</option>
        <option value="ETH/USD OTC">ETH/USD OTC</option>
        <option value="GOLD OTC">GOLD OTC</option>
        <option value="SILVER OTC">SILVER OTC</option>
      </select>
      <div class="balance-info">$1,500.00</div>
    </div>

    <!-- Dashboard Content Area with Sniper Bot Widget -->
    <div class="dashboard-body">
      <div class="bot-modal">
        <div class="modal-header">
          <div class="bot-profile">
            <div class="bot-avatar">SNIPER</div>
            <div>
              <div class="bot-title">SNIPER BOT</div>
              <div class="bot-time-sub" id="subTime">TIME: 12:38:49</div>
            </div>
          </div>
          <div class="window-controls">
            <button class="control-btn">-</button>
            <button class="control-btn">×</button>
          </div>
        </div>

        <div class="status-bar">
          <div class="status-online">
            <div class="status-dot"></div>
            AI ENGINE ONLINE
          </div>
          <div class="verified-badge">VERIFIED: 3</div>
        </div>

        <!-- Scanner Output Screen -->
        <div class="display-screen" id="displayScreen">
          <div class="scanner-label">AI SIGNAL SCANNER</div>
          <div class="screen-content" id="screenContent">chart analysing..</div>
          <div class="scan-line"></div>
        </div>

        <div class="bottom-info">
          <a href="https://t.me/tradewithevu" target="_blank" class="telegram-link">
            <span>✈</span> @tradewithevu
          </a>
          <div class="live-clock" id="liveClock">12:39:00</div>
        </div>

        <button class="btn-action" id="signalBtn" onclick="generateSignal()">GET SIGNAL</button>
      </div>
    </div>

    <!-- Gemini Bottom Dock & Search Bar -->
    <div class="gemini-dock">
      <div class="action-row">
        <button class="icon-btn">👍</button>
        <button class="icon-btn">👎</button>
        <button class="icon-btn">⎘</button>
        <button class="icon-btn down-circle">↓</button>
        <button class="icon-btn">🔊</button>
      </div>

      <div class="gemini-bar">
        <span class="plus-icon">＋</span>
        <input type="text" class="gemini-input" placeholder="Ask Gemini about this market..." id="geminiInput">
        <span class="mic-icon">🎙</span>
        <div class="live-voice-pill">❙❙❙</div>
      </div>
    </div>
  </div>

  <script>
    let isAnalyzing = false;

    // Synchronize Real-Time Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds}`;

      document.getElementById('liveClock').textContent = timeString;
      document.getElementById('subTime').textContent = `TIME: ${timeString}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function syncPair() {
      const selectedPair = document.getElementById('otcPairSelect').value;
      if (!isAnalyzing) {
        document.getElementById('screenContent').innerHTML = `Selected:<br><span style="color:#fff;">${selectedPair}</span>`;
      }
    }

    // Signal Generator Engine
    function generateSignal() {
      if (isAnalyzing) return;

      isAnalyzing = true;
      const screen = document.getElementById('displayScreen');
      const content = document.getElementById('screenContent');
      const btn = document.getElementById('signalBtn');
      const currentPair = document.getElementById('otcPairSelect').value;

      screen.classList.add('scanning');
      btn.innerText = 'ANALYSING...';
      content.style.color = '#00e676';
      content.innerHTML = `Scanning ${currentPair}..`;

      setTimeout(() => {
        screen.classList.remove('scanning');
        isAnalyzing = false;
        btn.innerText = 'GET SIGNAL';

        const isCall = Math.random() > 0.45;
        const confidence = (Math.random() * (98 - 88) + 88).toFixed(1);

        if (isCall) {
          content.innerHTML = `
            <div style="font-size: 11px; color: #94a3b8;">${currentPair} (1M)</div>
            <div class="signal-direction signal-up">CALL ⬆</div>
            <div style="font-size: 11px; color: #00e676; margin-top: 2px;">ACCURACY: ${confidence}%</div>
          `;
        } else {
          content.innerHTML = `
            <div style="font-size: 11px; color: #94a3b8;">${currentPair} (1M)</div>
            <div class="signal-direction signal-down">PUT ⬇</div>
            <div style="font-size: 11px; color: #ff3366; margin-top: 2px;">ACCURACY: ${confidence}%</div>
          `;
        }
      }, 3000);
    }
  </script>
</body>
    </html>
